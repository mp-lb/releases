name: Publish desktop update feed

on:
  repository_dispatch:
    types: [desktop-release]
  workflow_dispatch:
    inputs:
      app:
        description: Application slug
        required: true
      version:
        description: Desktop version
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-feed-${{ inputs.app || github.event.client_payload.app }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Build and publish the feed
        env:
          APP_SLUG: ${{ inputs.app || github.event.client_payload.app }}
          DESKTOP_VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          python scripts/build-feed.py "$APP_SLUG" "$DESKTOP_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "feeds/$APP_SLUG"
          if ! git diff --cached --quiet; then
            git commit -m "Publish $APP_SLUG desktop feed for $DESKTOP_VERSION"
            for _ in {1..5}; do
              if git push; then exit 0; fi
              git pull --rebase
            done
            exit 1
          fi
